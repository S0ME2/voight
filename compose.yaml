services:
  cpu:
    image: voight:cpu
    build:
      context: .
      target: cpu
    env_file: .env
    environment:
      RUNTIME_TARGET: cpu
      MODEL_DIR: /opt/voight/models
    ports: ["${VOIGHT_PORT:-8000}:8000"]
    volumes: ["voight-artifacts:/app/logs"]

  gpu:
    image: voight:gpu
    build:
      context: .
      target: gpu
    profiles: [gpu]
    env_file: .env
    environment:
      RUNTIME_TARGET: gpu
      MODEL_DIR: /opt/voight/models
      GPU_ID: "${GPU_ID:-0}"
      REQUEST_QUEUE_LIMIT: "${REQUEST_QUEUE_LIMIT:-8}"
      LOCALIZATION_BATCH_SIZE: "${LOCALIZATION_BATCH_SIZE:-2}"
      TEXT_DETECTION_BATCH_SIZE: "${TEXT_DETECTION_BATCH_SIZE:-4}"
      TEXT_RECOGNITION_BATCH_SIZE: "${TEXT_RECOGNITION_BATCH_SIZE:-8}"
      TEXT_RECOGNITION_PROCESSES: "1"
    ports: ["${VOIGHT_PORT:-8000}:8000"]
    volumes: ["voight-artifacts:/app/logs"]
    gpus: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  voight-artifacts:
